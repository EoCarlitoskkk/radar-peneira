name: Automação do Bot de Peneiras

on:
  schedule:
    - cron: '0 9 * * *' # Roda automaticamente todos os dias
  workflow_dispatch: # Permite rodar manualmente quando você quiser

jobs:
  atualizar-peneiras:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Executar Bot
        run: python scraper.py

      - name: Salvar e Atualizar Dados no GitHub
        run: |
          git config --global user.name "Bot Peneiras"
          git config --global user.email "bot@github.com"
          git add peneiras.json
          git commit -m "Atualização automática das peneiras" || exit 0
          git push
