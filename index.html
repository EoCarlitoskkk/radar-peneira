<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar de Peneiras Pro</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; color: #333; }
    h1 { text-align: center; color: #2c3e50; }
    .card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .tag { display: inline-block; background: #27ae60; color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>

  <h1>Radar de Peneiras Pro</h1>
  <div id="lista-peneiras">Carregando oportunidades...</div>

  <script>
    // O '?v=' + Date.now() força o site a sempre pegar o JSON mais novo do robô
    fetch('peneiras.json?v=' + Date.now())
      .then(res => res.json())
      .then(dados => {
        const container = document.getElementById('lista-peneiras');
        if (dados.length === 0) {
          container.innerHTML = '<p>Nenhuma peneira encontrada no momento. O robô atualizará em breve!</p>';
          return;
        }
        container.innerHTML = dados.map(item => `
          <div class="card">
            <span class="tag">${item.esporte || 'Futebol'}</span>
            <h3>${item.clube || 'Clube não informado'}</h3>
            <p><strong>Local:</strong> ${item.cidade || ''} - ${item.estado || ''}</p>
            <p><strong>Categoria:</strong> ${item.categoria || 'Não especificada'}</p>
            <p><strong>Requisitos:</strong> ${item.requisitos || 'Sem informações adicionais'}</p>
            ${item.fonte ? `<a href="${item.fonte}" target="_blank">Ver fonte original</a>` : ''}
          </div>
        `).join('');
      })
      .catch(() => {
        document.getElementById('lista-peneiras').innerHTML = '<p>Erro ao carregar as peneiras.</p>';
      });
  </script>

</body>
</html>
