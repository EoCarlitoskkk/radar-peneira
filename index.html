<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar de Peneiras & Seletivas Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans flex flex-col">

    <!-- Cabeçalho -->
    <header class="bg-emerald-900/40 border-b border-emerald-500/20 py-4 px-4 sticky top-0 backdrop-blur-md z-40">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="p-2 bg-emerald-500/10 rounded-full text-emerald-400">
                    <i data-lucide="trophy" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold text-white">Radar de Peneiras Pro</h1>
                    <p class="text-xs text-emerald-400">Portal Nacional de Seletivas Esportivas</p>
                </div>
            </div>

            <!-- Botão de Perfil -->
            <div id="area-usuario">
                <button onclick="abrirModalAuth()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-3.5 rounded-xl text-xs flex items-center gap-2 transition-all shadow-md shadow-emerald-900/30">
                    <i data-lucide="user-check" class="w-4 h-4"></i>
                    <span id="label-login">Meu Perfil</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 space-y-6">

        <!-- Métricas Rápidas / Painel -->
        <div class="grid grid-cols-3 gap-3">
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-3 text-center">
                <span class="block text-xl font-extrabold text-emerald-400" id="stat-total">0</span>
                <span class="text-[10px] text-gray-400 uppercase tracking-wider font-semibold">Oportunidades</span>
            </div>
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-3 text-center">
                <span class="block text-xl font-extrabold text-emerald-400" id="stat-esportes">0</span>
                <span class="text-[10px] text-gray-400 uppercase tracking-wider font-semibold">Esportes</span>
            </div>
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-3 text-center">
                <span class="block text-xl font-extrabold text-yellow-400" id="stat-salvas">0</span>
                <span class="text-[10px] text-gray-400 uppercase tracking-wider font-semibold">Minhas Salvas</span>
            </div>
        </div>

        <!-- Abas -->
        <div class="flex border-b border-gray-800 gap-4">
            <button id="aba-todas" onclick="alternarAba('todas')" class="py-2 px-4 border-b-2 border-emerald-500 text-emerald-400 font-bold text-sm flex items-center gap-2">
                <i data-lucide="list" class="w-4 h-4"></i> Todas as Peneiras
            </button>
            <button id="aba-salvas" onclick="alternarAba('salvas')" class="py-2 px-4 border-b-2 border-transparent text-gray-400 font-bold text-sm hover:text-white flex items-center gap-2">
                <i data-lucide="star" class="w-4 h-4 text-yellow-400"></i> Favoritas (<span id="count-favoritos">0</span>)
            </button>
        </div>

        <!-- Painel de Filtros e Busca -->
        <div id="painel-filtros" class="bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-xl space-y-4">
            <div class="flex flex-col md:flex-row items-md-center justify-between gap-3">
                <h2 class="text-base font-semibold text-gray-200 flex items-center gap-2">
                    <i data-lucide="sliders" class="w-4 h-4 text-emerald-400"></i>
                    Filtrar Oportunidades
                </h2>
                <!-- Busca textual rápida -->
                <div class="relative flex-1 max-w-xs">
                    <i data-lucide="search" class="w-4 h-4 text-gray-500 absolute left-3 top-3"></i>
                    <input type="text" id="busca-texto" oninput="filtrarPeneiras()" placeholder="Buscar por clube ou cidade..." class="w-full bg-gray-800 border border-gray-700 rounded-xl pl-9 pr-3 py-1.5 text-white text-xs focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Esporte</label>
                    <select id="esporte" onchange="filtrarPeneiras()" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white text-xs focus:outline-none focus:border-emerald-500">
                        <option value="">Todos</option>
                        <option value="Futebol de Campo">Futebol de Campo</option>
                        <option value="Futsal">Futsal</option>
                        <option value="Basquete">Basquete</option>
                        <option value="Vôlei">Vôlei</option>
                        <option value="Handebol">Handebol</option>
                        <option value="Feminino">Feminino (Geral)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Estado (UF)</label>
                    <select id="estado" onchange="filtrarPeneiras()" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white text-xs focus:outline-none focus:border-emerald-500">
                        <option value="">Todos os Estados</option>
                        <option value="RS">Rio Grande do Sul (RS)</option>
                        <option value="SP">São Paulo (SP)</option>
                        <option value="RJ">Rio de Janeiro (RJ)</option>
                        <option value="MG">Minas Gerais (MG)</option>
                        <option value="PR">Paraná (PR)</option>
                        <option value="SC">Santa Catarina (SC)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Categoria</label>
                    <select id="categoria" onchange="filtrarPeneiras()" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white text-xs focus:outline-none focus:border-emerald-500">
                        <option value="">Todas</option>
                        <option value="Sub-13">Sub-13</option>
                        <option value="Sub-15">Sub-15</option>
                        <option value="Sub-17">Sub-17</option>
                        <option value="Sub-20">Sub-20</option>
                        <option value="Livre">Livre / Adulto</option>
                    </select>
                </div>

                <div class="flex items-end">
                    <button onclick="limparFiltros()" class="w-full bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-300 font-semibold py-2 rounded-xl text-xs transition-all flex items-center justify-center gap-1.5">
                        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Limpar Filtros
                    </button>
                </div>
            </div>
        </div>

        <!-- Lista de Resultados -->
        <div id="resultado" class="space-y-4">
            <div id="lista-peneiras" class="grid grid-cols-1 gap-4"></div>
        </div>

    </main>

    <!-- Modal de Inscrição / WhatsApp -->
    <div id="modal-inscricao" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl max-w-md w-full p-6 space-y-4 relative shadow-2xl">
            <button onclick="fecharModalInscricao()" class="absolute top-4 right-4 text-gray-400 hover:text-white">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <h3 class="text-lg font-bold text-white flex items-center gap-2">
                <i data-lucide="send" class="w-5 h-5 text-emerald-400"></i>
                Ficha de Pré-Inscrição
            </h3>
            <p id="modal-clube-nome" class="text-xs text-emerald-400 font-semibold"></p>

            <form onsubmit="enviarInscricaoWhatsApp(event)" class="space-y-3">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Nome Completo</label>
                    <input type="text" id="atleta-nome" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white text-xs">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Ano de Nascimento</label>
                        <input type="number" id="atleta-ano" required placeholder="Ex: 2008" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white text-xs">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Posição / Especialidade</label>
                        <input type="text" id="atleta-posicao" required placeholder="Ex: Meia / Armador" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white text-xs">
                    </div>
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs transition-all flex items-center justify-center gap-2">
                    <i data-lucide="message-square" class="w-4 h-4"></i> Enviar Ficha via WhatsApp
                </button>
            </form>
        </div>
    </div>

    <!-- Modal de Perfil / Login -->
    <div id="modal-auth" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl max-w-sm w-full p-6 space-y-4 relative shadow-2xl">
            <button onclick="fecharModalAuth()" class="absolute top-4 right-4 text-gray-400 hover:text-white">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <h3 class="text-lg font-bold text-white flex items-center gap-2">
                <i data-lucide="user" class="w-5 h-5 text-emerald-400"></i>
                Perfil do Atleta
            </h3>

            <form onsubmit="salvarPerfil(event)" class="space-y-3">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Seu Nome</label>
                    <input type="text" id="perfil-nome" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white text-xs">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Ano de Nascimento</label>
                    <input type="number" id="perfil-ano" placeholder="Ex: 2008" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white text-xs">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs transition-all">
                    Salvar Dados no Navegador
                </button>
            </form>
        </div>
    </div>

    <script>
        const peneirasDB = [
            {
                id: 1,
                esporte: "Futebol de Campo",
                clube: "Ypiranga FC",
                estado: "RS",
                cidade: "Erechim",
                endereco: "CT Ninho do Canário, Erechim - RS",
                categoria: "Sub-17",
                status: "Últimas Vagas",
                observacao: "Foco na avaliação técnica para elenco de competição.",
                requisitos: "Chuteira de trava, calção neutro e camiseta branca.",
                fonte: "https://www.yfc.com.br"
            },
            {
                id: 2,
                esporte: "Basquete",
                clube: "Sogipa Basquete",
                estado: "RS",
                cidade: "Porto Alegre",
                endereco: "Rua Barão do Cotegipe 415, Porto Alegre - RS",
                categoria: "Sub-15",
                status: "Inscrições Abertas",
                observacao: "Recomendado acima de 1,78m para posições de pivô.",
                requisitos: "Tênis adequado para quadra de madeira.",
                fonte: "https://sogipa.com.br"
            },
            {
                id: 3,
                esporte: "Vôlei",
                clube: "Sesi SP",
                estado: "SP",
                cidade: "São Paulo",
                endereco: "Rua Carlos Weber 835, São Paulo - SP",
                categoria: "Sub-17",
                status: "Inscrições Abertas",
                observacao: "Testes de alcance e impulsão vertical.",
                requisitos: "Atestado médico e joelheiras.",
                fonte: "https://sesisp.org.br"
            },
            {
                id: 4,
                esporte: "Feminino",
                clube: "Grêmio / Inter Feminino",
                estado: "RS",
                cidade: "Porto Alegre",
                endereco: "Sesc Protásio Alves, Porto Alegre - RS",
                categoria: "Sub-17",
                status: "Inscrições Abertas",
                observacao: "Alojamento disponível para aprovadas de fora da cidade.",
                requisitos: "RG, CPF e Atestado Médico com ECG.",
                fonte: "https://futebolpeneira.com.br"
            },
            {
                id: 5,
                esporte: "Futsal",
                clube: "Magnus Futsal Base",
                estado: "SP",
                cidade: "Sorocaba",
                endereco: "Arena Sorocaba, Sorocaba - SP",
                categoria: "Sub-20",
                status: "Últimas Vagas",
                observacao: "Seletiva para liga nacional de base.",
                requisitos: "Tênis de futsal antiderrapante.",
                fonte: "https://magnusfutsal.com.br"
            }
        ];

        let favoritos = JSON.parse(localStorage.getItem('peneiras_favoritas')) || [];
        let usuarioPerfil = JSON.parse(localStorage.getItem('usuario_perfil')) || { nome: '', ano: '' };
        let abaAtual = 'todas';
        let clubeSelecionadoModal = '';

        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            atualizarInterfaceUsuario();
            atualizarEstatisticas();
            renderizarLista(peneirasDB);
        });

        function atualizarEstatisticas() {
            document.getElementById('stat-total').innerText = peneirasDB.length;
            const esportesUnicos = new Set(peneirasDB.map(p => p.esporte)).size;
            document.getElementById('stat-esportes').innerText = esportesUnicos;
            document.getElementById('stat-salvas').innerText = favoritos.length;
            document.getElementById('count-favoritos').innerText = favoritos.length;
        }

        function atualizarInterfaceUsuario() {
            if (usuarioPerfil.nome) {
                document.getElementById('label-login').innerText = usuarioPerfil.nome.split(' ')[0];
                document.getElementById('perfil-nome').value = usuarioPerfil.nome;
                document.getElementById('perfil-ano').value = usuarioPerfil.ano || '';
            }
        }

        function abrirModalAuth() {
            document.getElementById('modal-auth').classList.remove('hidden');
        }

        function fecharModalAuth() {
            document.getElementById('modal-auth').classList.add('hidden');
        }

        function salvarPerfil(e) {
            e.preventDefault();
            usuarioPerfil.nome = document.getElementById('perfil-nome').value;
            usuarioPerfil.ano = document.getElementById('perfil-ano').value;
            localStorage.setItem('usuario_perfil', JSON.stringify(usuarioPerfil));
            atualizarInterfaceUsuario();
            fecharModalAuth();
        }

        function renderizarLista(itens) {
            const container = document.getElementById('lista-peneiras');
            container.innerHTML = '';

            let listaExibida = itens;
            if (abaAtual === 'salvas') {
                listaExibida = peneirasDB.filter(p => favoritos.includes(p.id));
            }

            if (listaExibida.length === 0) {
                container.innerHTML = `
                    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 text-center text-gray-400 space-y-2">
                        <i data-lucide="search-x" class="w-10 h-10 mx-auto text-gray-600"></i>
                        <p class="text-sm font-medium">${abaAtual === 'salvas' ? 'Você ainda não possui nenhuma seletiva salva nos favoritos.' : 'Nenhuma oportunidade encontrada para os filtros aplicados.'}</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            listaExibida.forEach(p => {
                const isFavorito = favoritos.includes(p.id);
                const corStatus = p.status === "Últimas Vagas" 
                    ? "bg-red-500/10 text-red-400 border-red-500/20" 
                    : "bg-emerald-500/10 text-emerald-400 border-emerald-500/20";

                const card = `
                    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-lg space-y-3 relative hover:border-gray-700 transition-all">
                        <div class="flex items-start justify-between border-b border-gray-800 pb-3">
                            <div>
                                <div class="flex items-center gap-2 mb-1.5">
                                    <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full border ${corStatus}">${p.status}</span>
                                    <span class="text-[11px] bg-emerald-500/10 text-emerald-400 font-bold px-2.5 py-0.5 rounded-full border border-emerald-500/20">${p.esporte}</span>
                                    <span class="text-[11px] bg-gray-800 text-gray-300 font-bold px-2.5 py-0.5 rounded-full border border-gray-700">${p.categoria}</span>
                                </div>
                                <h4 class="text-lg font-bold text-white">${p.clube}</h4>
                                <p class="text-xs text-gray-400 flex items-center gap-1 mt-1">
                                    <i data-lucide="map-pin" class="w-3.5 h-3.5 text-gray-500"></i> ${p.cidade} - ${p.estado}
                                </p>
                            </div>
                            
                            <button onclick="toggleFavorito(${p.id})" class="p-2 rounded-xl bg-gray-800 hover:bg-gray-700 border border-gray-700 transition-all">
                                <i data-lucide="star" class="w-4 h-4 ${isFavorito ? 'text-yellow-400 fill-yellow-400' : 'text-gray-400'}"></i>
                            </button>
                        </div>

                        <div class="bg-gray-950/60 p-3 rounded-xl border border-gray-800/80 text-xs text-gray-400 space-y-1">
                            <p><strong class="text-gray-200">Requisitos:</strong> ${p.requisitos}</p>
                            <p><strong class="text-gray-200">Detalhes Técnicos:</strong> ${p.observacao}</p>
                        </div>

                        <div class="pt-2 flex flex-wrap items-center justify-between gap-2 border-t border-gray-800 text-xs">
                            <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.endereco)}" target="_blank" class="text-blue-400 hover:underline flex items-center gap-1 font-medium">
                                <i data-lucide="navigation" class="w-3.5 h-3.5"></i> Mapa
                            </a>

                            <div class="flex items-center gap-2">
                                <button onclick="abrirModalInscricao('${p.clube}')" class="font-semibold bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg transition-all flex items-center gap-1">
                                    <i data-lucide="file-text" class="w-3.5 h-3.5"></i> Inscrição WhatsApp
                                </button>
                                <a href="${p.fonte}" target="_blank" class="font-semibold bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg border border-gray-700 transition-all">
                                    Edital
                                </a>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });

            lucide.createIcons();
        }

        function toggleFavorito(id) {
            if (favoritos.includes(id)) {
                favoritos = favoritos.filter(fId => fId !== id);
            } else {
                favoritos.push(id);
            }
            localStorage.setItem('peneiras_favoritas', JSON.stringify(favoritos));
            atualizarEstatisticas();
            renderizarLista(peneirasDB);
        }

        function alternarAba(aba) {
            abaAtual = aba;
            const btnTodas = document.getElementById('aba-todas');
            const btnSalvas = document.getElementById('aba-salvas');
            
            if (aba === 'todas') {
                btnTodas.className = "py-2 px-4 border-b-2 border-emerald-500 text-emerald-400 font-bold text-sm flex items-center gap-2";
                btnSalvas.className = "py-2 px-4 border-b-2 border-transparent text-gray-400 font-bold text-sm hover:text-white flex items-center gap-2";
                document.getElementById('painel-filtros').classList.remove('hidden');
            } else {
                btnSalvas.className = "py-2 px-4 border-b-2 border-yellow-500 text-yellow-400 font-bold text-sm flex items-center gap-2";
                btnTodas.className = "py-2 px-4 border-b-2 border-transparent text-gray-400 font-bold text-sm hover:text-white flex items-center gap-2";
                document.getElementById('painel-filtros').classList.add('hidden');
            }

            renderizarLista(peneirasDB);
        }

        function filtrarPeneiras() {
            const busca = document.getElementById('busca-texto').value.trim().toLowerCase();
            const esporte = document.getElementById('esporte').value;
            const estado = document.getElementById('estado').value;
            const categoria = document.getElementById('categoria').value;

            const resultado = peneirasDB.filter(item => {
                const bateTexto = !busca || item.clube.toLowerCase().includes(busca) || item.cidade.toLowerCase().includes(busca);
                const bateEsporte = !esporte || item.esporte === esporte;
                const bateEstado = !estado || item.estado === estado;
                const bateCategoria = !categoria || item.categoria === categoria;
                return bateTexto && bateEsporte && bateEstado && bateCategoria;
            });

            renderizarLista(resultado);
        }

        function limparFiltros() {
            document.getElementById('busca-texto').value = '';
            document.getElementById('esporte').value = '';
            document.getElementById('estado').value = '';
            document.getElementById('categoria').value = '';
            filtrarPeneiras();
        }

        function abrirModalInscricao(clube) {
            clubeSelecionadoModal = clube;
            document.getElementById('modal-clube-nome').innerText = "Seletiva: " + clube;
            
            if (usuarioPerfil.nome) {
                document.getElementById('atleta-nome').value = usuarioPerfil.nome;
            }
            if (usuarioPerfil.ano) {
                document.getElementById('atleta-ano').value = usuarioPerfil.ano;
            }

            document.getElementById('modal-inscricao').classList.remove('hidden');
        }

        function fecharModalInscricao() {
            document.getElementById('modal-inscricao').classList.add('hidden');
        }

        function enviarInscricaoWhatsApp(e) {
            e.preventDefault();
            const nome = document.getElementById('atleta-nome').value;
            const ano = document.getElementById('atleta-ano').value;
            const posicao = document.getElementById('atleta-posicao').value;

            const mensagem = `Olá! Tenho interesse na seletiva do *${clubeSelecionadoModal}*.\n\n*Atleta:* ${nome}\n*Ano:* ${ano}\n*Posição/Especialidade:* ${posicao}`;
            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensagem)}`;
            
            window.open(url, '_blank');
            fecharModalInscricao();
        }
    </script>
</body>
</html>
